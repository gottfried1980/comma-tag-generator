<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="wpBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21759b" />
      <stop offset="100%" stop-color="#00a0d2" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a0d2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#21759b" stop-opacity="0"/>
    </linearGradient>
    
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Ambient Glow in Background -->
  <circle cx="950" cy="200" r="250" fill="url(#glowGrad)" filter="url(#glow)" opacity="0.4" />
  <circle cx="150" cy="100" r="180" fill="url(#glowGrad)" filter="url(#glow)" opacity="0.15" />

  <!-- Abstract Tech Graphic: Connected Tags / Wissensgraph Aesthetic -->
  <g transform="translate(800, 80)" opacity="0.85">
    <!-- Connection Lines -->
    <line x1="120" y1="60" x2="240" y2="100" stroke="#30363d" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="120" y1="60" x2="60" y2="160" stroke="url(#wpBlue)" stroke-width="2" />
    <line x1="60" y1="160" x2="160" y2="240" stroke="#30363d" stroke-width="2" />
    <line x1="240" y1="100" x2="160" y2="240" stroke="url(#wpBlue)" stroke-width="1.5" />
    <line x1="240" y1="100" x2="280" y2="220" stroke="#30363d" stroke-width="2" />
    <line x1="160" y1="240" x2="40" y2="280" stroke="#30363d" stroke-width="2" stroke-dasharray="2 2" />

    <!-- Tag Node 1 -->
    <g transform="translate(120, 60)">
      <rect x="-60" y="-20" width="120" height="40" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
      <circle cx="-40" cy="0" r="4" fill="#00a0d2" />
      <text x="-25" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e" font-weight="600">WordPress</text>
    </g>

    <!-- Tag Node 2 (Active/Glow) -->
    <g transform="translate(60, 160)">
      <rect x="-55" y="-20" width="110" height="40" rx="8" fill="#1f6feb" stroke="#58a6ff" stroke-width="2" filter="url(#glow)"/>
      <rect x="-55" y="-20" width="110" height="40" rx="8" fill="#1f6feb" stroke="#58a6ff" stroke-width="1.5"/>
      <circle cx="-35" cy="0" r="4" fill="#ffffff" />
      <text x="-20" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#ffffff" font-weight="bold">Category</text>
    </g>

    <!-- Tag Node 3 -->
    <g transform="translate(240, 100)">
      <rect x="-45" y="-20" width="90" height="40" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
      <circle cx="-25" cy="0" r="4" fill="#ff7b72" />
      <text x="-12" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e" font-weight="600">Plugin</text>
    </g>

    <!-- Tag Node 4 -->
    <g transform="translate(160, 240)">
      <rect x="-40" y="-20" width="80" height="40" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
      <circle cx="-22" cy="0" r="4" fill="#79c0ff" />
      <text x="-10" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e" font-weight="600">Tags</text>
    </g>

    <!-- Tag Node 5 -->
    <g transform="translate(280, 220)">
      <rect x="-50" y="-20" width="100" height="40" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
      <circle cx="-30" cy="0" r="4" fill="#39d353" />
      <text x="-15" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e" font-weight="600">Automation</text>
    </g>
  </g>

  <!-- Typography / Brand Elements (Left Aligned) -->
  <g transform="translate(80, 0)">
    <!-- Code Bracket Icon Decor -->
    <text x="0" y="150" font-family="Courier, monospace" font-size="28" fill="#58a6ff" font-weight="bold" opacity="0.4">&lt;/&gt;</text>
    
    <!-- Main Title -->
    <text x="0" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Comma-separated Tag &amp;
    </text>
    <text x="0" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" fill="url(#wpBlue)" letter-spacing="-1">
      Category Generator
    </text>

    <!-- Subtitle / Description -->
    <text x="0" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#8b949e" font-weight="400">
      Effortless bulk taxonomy automation for WordPress developers.
    </text>

    <!-- Decorative Badges inside SVG -->
    <g transform="translate(0, 340)">
      <rect x="0" y="0" width="75" height="24" rx="4" fill="#21262d" stroke="#30363d" />
      <text x="37.5" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e" font-weight="600" text-anchor="middle">v1.11</text>

      <rect x="85" y="0" width="65" height="24" rx="4" fill="#21262d" stroke="#30363d" />
      <text x="117.5" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e" font-weight="600" text-anchor="middle">GPL-2.0</text>
      
      <rect x="160" y="0" width="110" height="24" rx="4" fill="#1f6feb" fill-opacity="0.1" stroke="#388bfd" stroke-opacity="0.4" />
      <text x="215" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#58a6ff" font-weight="600" text-anchor="middle">Multi-Language</text>
    </g>
  </g>
</svg>
